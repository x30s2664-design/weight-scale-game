</style></head><body><main>
<div class="muted">三年級數學・公斤和公克</div><h1>兩種秤・四關挑戰</h1>
<section id="home"><p>讀重量、畫指針。答對 3 題，就能到下一關！</p><div class="cards" id="cards"></div><div class="actions"><button id="reset">重設進度</button></div></section>
<section id="game" hidden><div class="actions"><button id="back">返回首頁</button><button id="new">換一題</button><button id="next" hidden>下一階段</button></div><h2 id="heading"></h2><div class="badge" id="progress"></div>
<div class="layout"><section class="panel"><div class="mission" id="mission"></div><div id="weighing"><div class="plate" id="plate" aria-label="秤盤"></div><div id="weightAnswerSlot"></div><div class="neck"></div></div><nav id="pageZoomBar" aria-label="秤面放大控制"><span>秤面大小</span><button id="pageZoomOut" type="button" aria-label="縮小秤面">－</button><output id="pageZoomValue" aria-live="polite">100%</output><button id="pageZoomIn" type="button" aria-label="放大秤面">＋</button><button id="pageZoomReset" type="button">還原</button></nav><div id="dialViewport"><div id="dialSlot"><svg class="dial" id="dial" viewBox="0 0 340 340" role="img" aria-label="1 公斤指針秤"></svg></div></div><div class="actions" id="zoomActions"><button id="zoomOpen" type="button">🔍 放大秤面</button></div><p class="muted" id="dialHint"></p><div id="question"></div><div class="actions" id="drawingControls" hidden><button id="minus">變輕一小格</button><button id="plus">變重一小格</button><button id="weighPointer" type="button">秤重</button><output id="pointerWeight" aria-live="polite" class="badge">上次：還沒秤</output></div><div id="standardAnswerSlot"></div><form id="answerForm" novalidate><div id="answerInput"><div id="combinedUnits" hidden><label>公斤（kg）<input id="kgAnswer" type="number" min="0" step="1" inputmode="numeric" placeholder="0"></label><label>公克（g）<input id="gAnswer" type="number" min="0" step="1" inputmode="numeric" placeholder="0"></label></div><div id="singleUnit"><label for="answer">重量</label><input id="answer" type="number" min="0" step="any" inputmode="numeric" required style="width:140px;font:inherit;padding:12px;border:1px solid #b5c9cf;border-radius:12px;margin:12px"><label for="answerUnit" class="unit-label">單位</label><select id="answerUnit" aria-label="重量單位"><option value="g">公克 g</option><option value="kg">公斤 kg</option></select></div></div><button class="primary" id="check" type="submit">確認答案</button><div class="message" id="message" role="status" aria-live="polite"></div></form></section>
<section class="panel"><div id="itemsPanel"><h2>物品區</h2><p class="muted">拖一件物品到秤盤。靠近畫面邊緣，畫面會跟著移動。</p><div class="objects" id="objects"></div><div class="actions"><button id="clear">拿走物品</button></div></div><h2>讀秤小提醒</h2><p id="scaleRules">① 秤放在平面上。<br>② 空秤指針指在 0。<br>③ 從正前方看指針。<br>④ 每大格 50 公克，每小格 5 公克。<br>⑤ 1 公斤＝1000 公克。</p><p class="muted">答對後，物品下方會顯示重量。</p></section></div></section>
</main><div id="magnifier" hidden aria-hidden="true"><svg id="lensSvg" viewBox="0 0 70 70"></svg></div><script>
'use strict';
let pageZoom=1;
function setPageZoom(value){pageZoom=Math.max(1,Math.min(2,Math.round(value*100)/100));document.getElementById('dial').style.width=(340*pageZoom)+'px';document.getElementById('dial').style.maxWidth='none';document.getElementById('pageZoomValue').textContent=Math.round(pageZoom*100)+'%';document.getElementById('pageZoomOut').disabled=pageZoom<=1;document.getElementById('pageZoomIn').disabled=pageZoom>=2;if(typeof hideMagnifier==='function')hideMagnifier();}
document.getElementById('pageZoomIn').onclick=()=>setPageZoom(pageZoom+.25);document.getElementById('pageZoomOut').onclick=()=>setPageZoom(pageZoom-.25);document.getElementById('pageZoomReset').onclick=()=>setPageZoom(1);document.getElementById('pageZoomOut').disabled=true;

const $=id=>document.getElementById(id),KEY='grade3-four-scale-stages-v1';
const names=['1 公斤秤：辨別重量','1 公斤秤：畫出指針','3 公斤秤：辨別重量','3 公斤秤：畫出指針'],descriptions=['看指針，填重量。','看題目，轉指針。','看指針，填重量。','看題目，轉指針。'];
const baseObjects=[['🍬','糖果',75],['🍎','蘋果',150],['🥛','牛奶',225],['📘','課本',350],['🍚','米袋',500],['📦','箱子',650]];
let objects=baseObjects;const largeObjects=[['🍊','柳丁',130],['📘','課本',380],['🥤','水壺',750],['🍚','米袋',1000],['🍈','水果',1300],['🍉','西瓜',2400]];function capacity(){return stage<2?1000:3000;}function minor(){return stage<2?5:10;}function reading(){return stage%2===0;}function drawing(){return stage%2===1;}
let wins=[0,0,0,0];try{const p=JSON.parse(localStorage.getItem(KEY));if(Array.isArray(p))wins=wins.map((_,i)=>Math.min(3,Math.max(0,Math.floor(Number(p[i])||0))));}catch(e){}
const lastWeighed=[null,null,null,null];const learned=new Set();let currentObject=-1;
let stage=0,weight=0,onPlate=false,target=0,pointer=0,pointerTouched=false,counted=false,lastTarget=-1,dragCleanup=null;
function save(){try{localStorage.setItem(KEY,JSON.stringify(wins));}catch(e){}}
function unlocked(i){return i===0||wins[i-1]>=3;}
function stagePicture(i){const color=['#61b6a7','#6e9fe3','#e7a252','#ae8bd2'][i],bg=['#e4f4ee','#e8effd','#fff0db','#f0e9fa'][i];let ticks='';for(let n=0;n<20;n++){const a=n*Math.PI/10,x=160+Math.sin(a)*47,y=125-Math.cos(a)*47,x2=160+Math.sin(a)*41,y2=125-Math.cos(a)*41;ticks+=`<line x1="${x}" y1="${y}" x2="${x2}" y2="${y2}" stroke="#5b6c72" stroke-width="2"/>`;}return `<svg viewBox="0 0 320 210" role="img" aria-label="${i<2?'1':'3'}公斤秤，${i%2===0?'辨別重量':'畫指針'}插圖"><rect width="320" height="210" rx="22" fill="${bg}"/><circle cx="56" cy="58" r="22" fill="white" opacity=".65"/><circle cx="272" cy="163" r="28" fill="white" opacity=".65"/><path d="M110 76 L100 178 Q100 188 112 188 H208 Q220 188 220 178 L210 76Z" fill="${color}"/><rect x="147" y="48" width="26" height="32" rx="5" fill="${color}"/><path d="M102 43 Q160 65 218 43 L210 58 H110Z" fill="#fdfefe" stroke="${color}" stroke-width="4"/><circle cx="160" cy="125" r="55" fill="#fffefa" stroke="#fff" stroke-width="5"/>${ticks}<text x="160" y="103" text-anchor="middle" font-size="12" font-family="system-ui" fill="#53636e">${i<2?'1':'3'} kg</text><path d="M160 125 L${i%2===0?'190 92':'137 87'}" stroke="#d66950" stroke-width="3" stroke-linecap="round"/><circle cx="160" cy="125" r="5" fill="#d66950"/><text x="56" y="147" font-size="47">${i%2===0?(i<2?'🍎':'🍉'):'✏️'}</text><text x="249" y="81" font-size="32">${i%2===0?'🔎':'🎯'}</text><path d="M245 104 L253 104 M249 100 L249 108" stroke="${color}" stroke-width="3" stroke-linecap="round"/></svg>`;}
function update(){ $('cards').replaceChildren();names.forEach((name,i)=>{const card=document.createElement('article');card.className='card stage-card stage-'+i;const picture=document.createElement('div');picture.className='stage-picture';picture.innerHTML=stagePicture(i);const step=document.createElement('div');step.className='stage-step';step.textContent='LEVEL 0'+(i+1)+' · '+(i<2?'1 公斤秤':'3 公斤秤');const title=document.createElement('h2');title.textContent=i%2===0?'辨別重量':'畫出指針';const p=document.createElement('p');p.textContent=descriptions[i];const badge=document.createElement('p');badge.className='badge';badge.textContent=wins[i]+' / 3 題';const b=document.createElement('button');b.className='primary';b.textContent=unlocked(i)?'開始挑戰':'尚未解鎖';b.disabled=!unlocked(i);b.onclick=()=>play(i);const footer=document.createElement("div");footer.className="stage-footer";footer.append(badge,b);card.append(picture,step,title,p,footer);$('cards').append(card);});$('progress').textContent='本階段 '+wins[stage]+' / 3 題';$('next').hidden=!(stage<3&&wins[stage]>=3);}
function xy(g,r){const a=g/capacity()*Math.PI*2;return [170+Math.sin(a)*r,170-Math.cos(a)*r];}
function dial(g){const large=stage>=2;let s='<circle cx="170" cy="170" r="153" fill="#fffdf7" stroke="#375d52" stroke-width="3"/>';for(let v=0;v<capacity();v+=minor()){const major=v%(large?100:50)===0,halfKilo=large&&v%500===0,a=xy(v,149),b=xy(v,halfKilo?122:major?132:142);s+=`<line x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}" stroke="#354d46" stroke-width="${halfKilo?2.8:major?1.8:1}"/>`;}
const labels=large?[[0,'0'],[500,'500g'],[1000,'1kg'],[2000,'2kg']]:Array.from({length:20},(_,i)=>[i*50,String(i*50)]);for(const [v,label] of labels){const p=xy(v,large?112:117);s+=`<text x="${p[0]}" y="${p[1]+5}" text-anchor="middle" font-size="${large?18:12}">${label}</text>`;}
s+=`<text x="170" y="82" text-anchor="middle" font-size="15">${large?3:1} kg</text><text x="170" y="205" text-anchor="middle" font-size="12">最大秤重 ${large?3:1} 公斤</text><text x="170" y="223" text-anchor="middle" font-size="12" font-weight="700">每大格 ${large?100:50} 公克</text><text x="170" y="241" text-anchor="middle" font-size="12" font-weight="700">每小格 ${minor()} 公克</text>`;const p=xy(g,146);s+=`<line x1="170" y1="170" x2="${p[0]}" y2="${p[1]}" stroke="#a93622" stroke-width="1.8" stroke-linecap="round"/><circle cx="170" cy="170" r="5" fill="#a93622"/>`;$('dial').innerHTML=s;if(magnifying&&lastLensPoint)showLens(lastLensPoint.x,lastLensPoint.y);}

function setWeight(i){if(counted){$('message').textContent='答對了！把物品拖回去吧。';return;}const o=objects[i];currentObject=i;weight=o[2];onPlate=true;const icon=document.createElement('span');icon.className='weighed-item';icon.textContent=o[0];icon.setAttribute('role','img');icon.setAttribute('aria-label',o[1]);icon.style.cursor='pointer';icon.setAttribute('role','button');icon.setAttribute('tabindex','0');icon.setAttribute('aria-label','拿走'+o[1]);setupReturnDrag(icon,o);icon.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();$('clear').click();}};$('plate').replaceChildren(icon);dial(weight);$('answer').value='';$('message').textContent='看指針，填重量！';}
function followDragViewport(x,y,dt){
const edge=Math.min(100,window.innerHeight*.2),maxSpeed=650;
let dy=0,dx=0;
if(y<edge)dy=-maxSpeed*Math.min(1,Math.max(0,(edge-y)/edge));
else if(y>window.innerHeight-edge)dy=maxSpeed*Math.min(1,Math.max(0,(y-(window.innerHeight-edge))/edge));
const side=Math.min(70,window.innerWidth*.15);
if(x<side)dx=-maxSpeed*Math.min(1,Math.max(0,(side-x)/side));
else if(x>window.innerWidth-side)dx=maxSpeed*Math.min(1,Math.max(0,(x-(window.innerWidth-side))/side));
if(dx||dy)window.scrollBy({left:dx*dt,top:dy*dt,behavior:'instant'});
}
function setupReturnDrag(icon,o){
let d=null,ghost=null,raf=0,suppress=false;const speed=900/(1+o[2]/400);icon.style.touchAction='none';icon.style.userSelect='none';icon.setAttribute('aria-label','將'+o[1]+'拖回物品區');
function inside(x,y){const r=$('itemsPanel').getBoundingClientRect();return x>=r.left&&x<=r.right&&y>=r.top&&y<=r.bottom;}
function clean(){cancelAnimationFrame(raf);if(ghost)ghost.remove();ghost=null;d=null;icon.style.opacity='';$('itemsPanel').classList.remove('return-hover');}
function loop(now){if(!d||!d.moved)return;const dt=Math.min(.05,(now-d.time)/1000);d.time=now;followDragViewport(d.tx,d.ty,dt);const dx=d.tx-d.x,dy=d.ty-d.y,len=Math.hypot(dx,dy),step=Math.min(len,speed*dt);if(len){d.x+=dx/len*step;d.y+=dy/len*step;}ghost.style.left=d.x+'px';ghost.style.top=d.y+'px';$('itemsPanel').classList.toggle('return-hover',inside(d.x,d.y));raf=requestAnimationFrame(loop);}
icon.addEventListener('pointerdown',e=>{if(e.button!==0||d)return;if(dragCleanup)dragCleanup();dragCleanup=clean;d={id:e.pointerId,x:e.clientX,y:e.clientY,sx:e.clientX,sy:e.clientY,tx:e.clientX,ty:e.clientY,time:performance.now(),moved:false};icon.setPointerCapture(e.pointerId);});
icon.addEventListener('pointermove',e=>{if(!d||e.pointerId!==d.id)return;d.tx=e.clientX;d.ty=e.clientY;if(!d.moved&&Math.hypot(d.tx-d.sx,d.ty-d.sy)>8){d.moved=true;ghost=document.createElement('div');ghost.className='ghost';ghost.textContent=o[0];ghost.style.left=d.x+'px';ghost.style.top=d.y+'px';document.body.append(ghost);icon.style.opacity='.25';d.time=performance.now();raf=requestAnimationFrame(loop);}});
icon.addEventListener('pointerup',e=>{if(!d||e.pointerId!==d.id)return;const moved=d.moved,hit=moved&&inside(d.x,d.y);suppress=moved;clean();if(hit)$('clear').click();else if(moved)$('message').textContent='拖回物品區，再放手喔！';setTimeout(()=>suppress=false,0);});
icon.addEventListener('pointercancel',clean);icon.addEventListener('lostpointercapture',clean);icon.onclick=e=>{if(suppress){e.preventDefault();return;}$('message').textContent='把物品拖回去吧！';};}
function objectButton(o,i){const b=document.createElement('button');b.className='object';b.dataset.object=String(i);b.innerHTML=`<span class="emoji">${o[0]}</span>${o[1]}`;if(learned.has((stage<2?0:100)+i)){const label=document.createElement('small');label.className='known-weight';label.textContent='✓ '+o[2]+' 公克';b.classList.add('answered');b.append(label);}b.setAttribute('aria-label','放入'+o[1]);let d=null,ghost=null,raf=0,suppress=false;const speed=900/(1+o[2]/400);b.onclick=()=>setWeight(i);
function hit(x,y){const r=$('plate').getBoundingClientRect();return x>=r.left&&x<=r.right&&y>=r.top&&y<=r.bottom;}
function clean(){cancelAnimationFrame(raf);if(ghost)ghost.remove();ghost=null;d=null;$('plate').classList.remove('hover');}
function loop(now){if(!d||!d.moved)return;const dt=Math.min(.05,(now-d.time)/1000);d.time=now;followDragViewport(d.tx,d.ty,dt);const dx=d.tx-d.x,dy=d.ty-d.y,len=Math.hypot(dx,dy),step=Math.min(len,speed*dt);if(len){d.x+=dx/len*step;d.y+=dy/len*step;}ghost.style.left=d.x+'px';ghost.style.top=d.y+'px';$('plate').classList.toggle('hover',hit(d.x,d.y));raf=requestAnimationFrame(loop);}
b.addEventListener('pointerdown',e=>{if(e.button!==0||d||counted)return;if(dragCleanup)dragCleanup();dragCleanup=clean;d={id:e.pointerId,x:e.clientX,y:e.clientY,sx:e.clientX,sy:e.clientY,tx:e.clientX,ty:e.clientY,time:performance.now(),moved:false};b.setPointerCapture(e.pointerId);});b.addEventListener('pointermove',e=>{if(!d||d.id!==e.pointerId)return;d.tx=e.clientX;d.ty=e.clientY;if(!d.moved&&Math.hypot(d.tx-d.sx,d.ty-d.sy)>8){d.moved=true;ghost=document.createElement('div');ghost.className='ghost';ghost.textContent=o[0];ghost.style.left=d.x+'px';ghost.style.top=d.y+'px';document.body.append(ghost);d.time=performance.now();raf=requestAnimationFrame(loop);}});b.addEventListener('pointerup',e=>{if(!d||d.id!==e.pointerId)return;if(d.moved){suppress=true;if(hit(d.x,d.y))setWeight(i);else $('message').textContent='到秤盤再放手喔！';setTimeout(()=>suppress=false,0);}clean();});b.addEventListener('pointercancel',clean);b.addEventListener('lostpointercapture',clean);b.addEventListener('click',e=>{if(suppress){e.preventDefault();e.stopImmediatePropagation();}},true);return b;}
function newRound(){hideMagnifier();if(dragCleanup)dragCleanup();counted=false;onPlate=false;weight=0;pointer=0;pointerTouched=false;$('answer').value='';$('kgAnswer').value='';$('gAnswer').value='';$('answerUnit').value='g';$('check').disabled=false;$('check').textContent='確認答案';$('message').classList.remove('correct');$('message').textContent='';$('plate').textContent='把一件物品放在這裡';dial(0);
if(reading()){$('mission').textContent='這個物品有多重？';$('dialHint').textContent='一次放一件。每小格 '+minor()+' 公克，最多秤 '+capacity()+' 公克。';}
if(drawing()){let t;do{t=(1+Math.floor(Math.random()*(capacity()/minor()-1)))*minor();}while(t===lastTarget);target=t;lastTarget=t;$('mission').textContent='畫出 '+target+' 公克的指針';$('dialHint').textContent='拖動指針，或按「變重」「變輕」。';}

}
function play(i){if(!unlocked(i))return;hideMagnifier();stage=i;$('scaleRules').innerHTML='① 放平秤。<br>② 空秤要指在 0。<br>③ 從正前方看。<br>④ 大格 '+(i<2?50:100)+' 公克，小格 '+(i<2?5:10)+' 公克。<br>⑤ 1 公斤＝1000 公克。';objects=i<2?baseObjects:largeObjects;$('home').hidden=true;$('game').hidden=false;$('pointerWeight').textContent=lastWeighed[i]===null?'上次：還沒秤':'上次：'+weightLabel(lastWeighed[i]);$('heading').textContent='第'+(i+1)+'階段：'+names[i];$('weighing').hidden=i%2!==0;$('itemsPanel').hidden=i%2!==0;$('dial').hidden=false;$('pageZoomBar').hidden=false;$('dialViewport').hidden=false;$('zoomActions').hidden=false;$('dialHint').hidden=false;$('drawingControls').hidden=i%2!==1;$('answerInput').hidden=i%2===1;$('answer').required=i%2!==1;$('combinedUnits').hidden=i<2;$('singleUnit').hidden=i>=2;(i%2===0?$('weightAnswerSlot'):$('standardAnswerSlot')).append($('answerForm'));$('question').hidden=true;if(i%2===0)$('objects').replaceChildren(...objects.map(objectButton));$('dial').style.touchAction=i%2===1?'none':'auto';$('dial').setAttribute('tabindex',i%2===1?'0':'-1');$('dial').setAttribute('aria-label',i%2===1?'用方向鍵轉指針':(i<2?'1':'3')+' 公斤指針秤');update();newRound();window.scrollTo(0,0);}
function movePointer(v){if(!drawing()||counted)return;pointer=Math.max(0,Math.min(capacity()-minor(),v));pointerTouched=true;dial(pointer);$('message').textContent='調好了嗎？按「確認答案」。';}
function fromPoint(e){const matrix=$('dial').getScreenCTM();if(!matrix)return;const location=new DOMPoint(e.clientX,e.clientY).matrixTransform(matrix.inverse()),x=location.x-170,y=location.y-170;if(Math.hypot(x,y)<20)return;let a=Math.atan2(x,-y);if(a<0)a+=2*Math.PI;movePointer((Math.round(a/(2*Math.PI)*(capacity()/minor()))%(capacity()/minor()))*minor());}
let drawingId=null;$('dial').addEventListener('pointerdown',e=>{if(!drawing()||counted||e.button!==0)return;drawingId=e.pointerId;$('dial').setPointerCapture(e.pointerId);fromPoint(e);});$('dial').addEventListener('pointermove',e=>{if(e.pointerId===drawingId)fromPoint(e);});['pointerup','pointercancel','lostpointercapture'].forEach(name=>$('dial').addEventListener(name,()=>drawingId=null));$('dial').addEventListener('keydown',e=>{if(drawing()&&['ArrowRight','ArrowUp','ArrowLeft','ArrowDown'].includes(e.key)){e.preventDefault();movePointer(pointer+(['ArrowRight','ArrowUp'].includes(e.key)?minor():-minor()));}});function weightLabel(g){return g>=1000?Math.floor(g/1000)+' 公斤 '+g%1000+' 公克（'+g+' 公克）':g+' 公克';}
$('weighPointer').onclick=()=>{lastWeighed[stage]=pointer;$('pointerWeight').textContent='上次：'+weightLabel(pointer);};
$('minus').onclick=()=>movePointer(pointer-minor());$('plus').onclick=()=>movePointer(pointer+minor());
$('answerForm').onsubmit=e=>{e.preventDefault();if(counted)return;if(reading()&&!onPlate){$('message').textContent='先放一件物品喔！';return;}if(drawing()&&!pointerTouched){$('message').textContent='先移動指針喔！';return;}if(reading()&&stage>=2){const k=$('kgAnswer').value.trim(),g=$('gAnswer').value.trim();if((k===''&&g==='')||![k||'0',g||'0'].every(v=>Number.isInteger(Number(v))&&Number(v)>=0)){$('message').textContent='填公斤和公克。不用的欄位可以空白。';return;}}if(!drawing()&&stage<2&&($('answer').value.trim()===''||!Number.isFinite(Number($('answer').value))||Number($('answer').value)<0)){$('message').textContent='填重量，再選單位喔！';$('answer').focus();return;}const actual=reading()?weight:target,value=drawing()?pointer:stage>=2?Number($('kgAnswer').value||0)*1000+Number($('gAnswer').value||0):Number($('answer').value)*($('answerUnit').value==='kg'?1000:1);if(Math.abs(value-actual)<0.000001){if(reading()){learned.add((stage<2?0:100)+currentObject);const card=$('objects').querySelector('[data-object="'+currentObject+'"]');if(card&&!card.querySelector('.known-weight')){const label=document.createElement('small');label.className='known-weight';label.textContent='✓ '+actual+' 公克';card.classList.add('answered');card.append(label);}}$('message').classList.add('correct');$('check').textContent='✓ 已答對';counted=true;wins[stage]=Math.min(3,wins[stage]+1);save();update();$('check').disabled=true;$('message').textContent='✅ 答對了！'+(drawing()?'指針位置正確。':actual+' 公克。')+(wins[stage]>=3?(stage<3?'可以到下一關囉！':'全部過關了！'):(reading()?'拖回物品，繼續玩！':'按「換一題」繼續玩！'));}else{$('message').textContent=drawing()?'再看一下刻度，每小格是 '+minor()+' 公克。':reading()?'再試試！先看大格，再數小格。':'還沒答對，請確認數字與單位。求總重量用加法，求差或扣除容器用減法。';}};
let magnifying=false,lastLensPoint=null;
function hideMagnifier(){magnifying=false;$('dial').style.touchAction=drawing()?'none':'auto';$('magnifier').hidden=true;$('zoomOpen').textContent='🔍 放大鏡';$('zoomOpen').setAttribute('aria-pressed','false');}
function showLens(x,y){if(!magnifying)return;const matrix=$('dial').getScreenCTM();if(!matrix)return;const location=new DOMPoint(x,y).matrixTransform(matrix.inverse());const sx=location.x,sy=location.y;lastLensPoint={x,y};$('lensSvg').innerHTML=$('dial').innerHTML;$('lensSvg').setAttribute('viewBox',`${sx-35} ${sy-35} 70 70`);$('magnifier').hidden=false;const size=Math.min(180,window.innerWidth-24);$('magnifier').style.width=size+'px';$('magnifier').style.height=size+'px';$('magnifier').style.left=Math.max(8,Math.min(window.innerWidth-size-8,x-size/2-3))+'px';$('magnifier').style.top=Math.max(8,Math.min(window.innerHeight-size-8,y-size/2-3))+'px';}
$('zoomOpen').textContent='🔍 放大鏡';$('zoomOpen').setAttribute('aria-pressed','false');
$('zoomOpen').onclick=()=>{if(magnifying){hideMagnifier();return;}magnifying=true;$('dial').style.touchAction='none';$('zoomOpen').textContent='🔍 關閉放大鏡';$('zoomOpen').setAttribute('aria-pressed','true');const r=$('dial').getBoundingClientRect();showLens(r.left+r.width/2,r.top+r.height*.15);$('message').textContent='在秤面上移動，放大看！也能拖動指針。';};
$('dial').addEventListener('pointermove',e=>{if(magnifying)showLens(e.clientX,e.clientY);});$('dial').addEventListener('pointerdown',e=>{if(magnifying){if(!drawing())$('dial').setPointerCapture(e.pointerId);showLens(e.clientX,e.clientY);}});window.addEventListener('scroll',()=>{if(magnifying)$('magnifier').hidden=true;});window.addEventListener('keydown',e=>{if(e.key==='Escape')hideMagnifier();});
$('back').onclick=()=>{hideMagnifier();if(dragCleanup)dragCleanup();$('game').hidden=true;$('home').hidden=false;update();};$('new').onclick=newRound;$('next').onclick=()=>play(stage+1);$('clear').onclick=()=>{if(counted){newRound();$('message').textContent='換一件物品試試看！';return;}weight=0;onPlate=false;$('plate').textContent='把一件物品放在這裡';dial(0);$('answer').value='';$('message').textContent='指針回到 0 囉！';};$('reset').onclick=()=>{if(confirm('要將四關進度歸零嗎？')){wins=[0,0,0,0];learned.clear();lastWeighed.fill(null);save();update();}};update();
